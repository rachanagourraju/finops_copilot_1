<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Operations Copilot</title>
<script src="/assets/plotly.min.js" defer></script>
<style>
  :root { font: 16px/1.5 "DM Sans", system-ui, sans-serif; color: #13263a; background: #f4f7fa; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  main { max-width: 1160px; padding: 32px 20px; margin: auto; }
  h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 0 0 20px; }
  h2 { font-size: 1.2rem; margin: 0 0 12px; }
  p { margin: 0; }
  form, .panel, .metric { border: 1px solid #d8e2ed; border-radius: 12px; background: white; padding: 16px; }
  form label, summary { font-weight: 650; }
  summary { cursor: pointer; }
  .ask { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  input { flex: 1 1 290px; min-width: 0; border: 1px solid #9cafc2; border-radius: 7px; padding: 10px; font: inherit; }
  button { border: 0; border-radius: 7px; padding: 10px 18px; background: #075c60; color: white; font: inherit; cursor: pointer; }
  button:disabled { opacity: .65; cursor: wait; }
  #status { margin: 12px 0; color: #4b6074; }
  #status.error { color: #a02336; }
  #results { display: grid; gap: 14px; }
  .panel, .plot { min-width: 0; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; }
  .metric span { display: block; color: #4b6074; }
  .metric strong { font-size: 1.35rem; }
  .analysis, pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  ul.analysis { margin: 0; padding-left: 1.25rem; }
  ul.analysis li + li { margin-top: 0.45rem; }
  .plot { width: 100%; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3ebf3; }
  pre { background: #eef3f8; padding: 12px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Finance Operations Copilot</h1>
  <form id="ask-form">
    <label for="question">Ask a finance question</label>
    <div class="ask">
      <input id="question" required maxlength="2000" value="Which cost centres drove the November 2025 overspend?">
      <button id="ask-button" type="submit">Run analysis</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="results" aria-label="Analysis results" hidden></section>
</main>
<script>
const form = document.querySelector("#ask-form");
const questionInput = document.querySelector("#question");
const button = document.querySelector("#ask-button");
const statusEl = document.querySelector("#status");
const results = document.querySelector("#results");
const currency = new Intl.NumberFormat("en-US", {style: "currency", currency: "USD"});
const percent = new Intl.NumberFormat("en-US", {maximumFractionDigits: 2});

function add(parent, tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

function number(value) {
  if (typeof value !== "number" && typeof value !== "string") return null;
  if (typeof value === "string" && !value.trim()) return null;
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : null;
}

function renderSummary(queries) {
  const totals = queries
    .filter(query => query.rows.length === 1)
    .map(query => query.rows[0])
    .filter(row => number(row.matched_rows) > 0 &&
      ["actual_spend", "budget", "variance_amount"].every(key => number(row[key]) !== null));
  if (totals.length !== 1) return;

  const row = totals[0];
  const variance = number(row.variance_amount);
  const rate = number(row.variance_pct);
  const direction = variance > 0 ? "Over budget" : variance < 0 ? "Under budget" : "On budget";
  const panel = add(results, "section", undefined, "panel");
  add(panel, "h2", "Summary");
  const cards = add(panel, "div", undefined, "metrics");

  for (const [label, value] of [
    ["Actual spend", currency.format(row.actual_spend)],
    ["Budget", currency.format(row.budget)],
    [direction, currency.format(Math.abs(variance))],
    ["Variance %", rate === null ? "—" : percent.format(rate) + "%"]
  ]) {
    const card = add(cards, "div", undefined, "metric");
    add(card, "span", label);
    add(card, "strong", value);
  }
}



function renderAnalysis(explanation) {
  const panel = add(results, "section", undefined, "panel");
  add(panel, "h2", "Analysis");
  const text = explanation.trim();
  const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const bulletPattern = /^\\?[-*•]\s+/;

  if (lines.length > 0 && lines.every(line => bulletPattern.test(line))) {
    const list = add(panel, "ul", undefined, "analysis");
    for (const line of lines) {
      add(list, "li", line.replace(bulletPattern, ""));
    }
  } else {
    add(panel, "p", text, "analysis");
  }
}

function renderQueries(queries) {
  if (!queries.length) return;
  const details = add(results, "details", undefined, "panel");
  add(details, "summary", "Query results and SQL");

  queries.forEach((query, index) => {
    add(details, "h3", "Query " + (index + 1));
    add(details, "pre", query.sql);
    if (!query.rows.length) {
      add(details, "p", "No matching rows.");
      return;
    }
    const columns = Object.keys(query.rows[0]);
    const table = add(add(details, "div", undefined, "table-scroll"), "table");
    const header = table.createTHead().insertRow();
    columns.forEach(column => { add(header, "th", column).scope = "col"; });
    const body = table.createTBody();
    for (const row of query.rows) {
      const tr = body.insertRow();
      columns.forEach(column => add(tr, "td", String(row[column] ?? "—")));
    }
  });
}

async function renderCharts(charts) {
  if (!charts.length) return true;
  const panel = add(results, "section", undefined, "panel");
  add(panel, "h2", charts.length === 1 ? "Chart" : "Charts");
  let success = true;

  for (const {figure} of charts) {
    const plot = add(panel, "div", undefined, "plot");
    try {
      const layout = {...figure.layout, autosize: true};
      delete layout.width;
      await window.Plotly.newPlot(plot, figure.data, layout, {
        responsive: true, displaylogo: false
      });
    } catch {
      plot.textContent = "This chart could not be displayed.";
      success = false;
    }
  }
  return success;
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  const question = questionInput.value.trim();
  if (!question) {
    questionInput.focus();
    statusEl.textContent = "Enter a finance question.";
    return;
  }
  button.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Running finance analysis…";
  for (const plot of results.querySelectorAll(".plot")) window.Plotly?.purge(plot);
  results.replaceChildren();
  results.hidden = true;

  try {
    const response = await fetch("/api/v1/analytics/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question})
    });
    if (!response.ok) throw new Error("Request failed (HTTP " + response.status + ").");

    const data = await response.json();
    renderSummary(data.queries);
    renderAnalysis(data.explanation);
    results.hidden = false;

    const chartsRendered = await renderCharts(data.charts);
    renderQueries(data.queries);
    const messages = {
      answered: "",
      no_data: "No matching finance data.",
      clarification: "Update your question and run it again.",
      query_failed: "The finance query did not complete.",
      chart_failed: "The query completed. No chart was generated."
    };
    statusEl.textContent = chartsRendered ? (messages[data.status] ?? "") :
      "The results are available below. A chart could not be displayed.";
  } catch (error) {
    statusEl.className = "error";
    statusEl.textContent = error.message;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
